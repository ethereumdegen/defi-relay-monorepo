# DigitalOcean App Platform Specification
# Deploy with: doctl apps create --spec .do/app.yaml
# Or import via DO dashboard: https://cloud.digitalocean.com/apps

name: keystore-server

services:
  - name: keystore-server
    # Build from Dockerfile
    dockerfile_path: Dockerfile

    # Source configuration - update these for your repo
    github:
      repo: your-org/keystore-server
      branch: main
      deploy_on_push: true

    # Instance configuration
    instance_size_slug: basic-xxs  # $5/month - upgrade as needed
    instance_count: 1

    # HTTP configuration
    http_port: 3000

    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment variables
    envs:
      # Required: Set in DO dashboard or with --env flag
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET

      # Domain for SIWE messages (set to your actual domain)
      - key: KEYSTORE_DOMAIN
        scope: RUN_TIME
        value: keystore.yourdomain.com

      # CORS origins (comma-separated)
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: https://stark.yourdomain.com,http://localhost:5173

      # Session settings
      - key: SESSION_TTL_SECS
        scope: RUN_TIME
        value: "3600"

      - key: CHALLENGE_TTL_SECS
        scope: RUN_TIME
        value: "300"

      # Max backup size (10MB)
      - key: MAX_ENCRYPTED_DATA_SIZE
        scope: RUN_TIME
        value: "10485760"

      # Logging
      - key: RUST_LOG
        scope: RUN_TIME
        value: keystore_server=info,tower_http=info

      # x402 Payment Config (OPTIONAL - remove if not using payments)
      # Uncomment and configure if you want to charge for backups
      # - key: X402_WALLET_ADDRESS
      #   scope: RUN_TIME
      #   value: "0xYourWalletAddress"
      # - key: X402_FACILITATOR_SIGNER
      #   scope: RUN_TIME
      #   type: SECRET
      # - key: X402_PAYMENT_TOKEN_ADDRESS
      #   scope: RUN_TIME
      #   value: "0xTokenContractAddress"
      # - key: X402_COST_PER_BACKUP
      #   scope: RUN_TIME
      #   value: "1000000000000000000000"
      # - key: X402_PAYMENT_NETWORK
      #   scope: RUN_TIME
      #   value: "base-sepolia"

# Database component (managed PostgreSQL)
databases:
  - name: keystore-db
    engine: PG
    version: "15"
    size: db-s-dev-database  # $7/month development tier
    num_nodes: 1
