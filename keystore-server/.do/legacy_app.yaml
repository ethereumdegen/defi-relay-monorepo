# DigitalOcean App Platform Specification
# Deploy with: doctl apps create --spec .do/app.yaml
# Or import via DO dashboard: https://cloud.digitalocean.com/apps

name: keystore-server

services:
  - name: keystore-server
    # Monorepo source configuration
    github:
      repo: ethereumdegen/defi-relay-monorepo
      branch: master
      deploy_on_push: true
    source_dir: /keystore-server
    dockerfile_path: Dockerfile

    # Instance configuration
    instance_size_slug: basic-xxs
    instance_count: 1

    # HTTP configuration
    http_port: 3000

    # Routes
    routes:
      - path: /

    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment variables
    envs:
      # Required: Set in DO dashboard or with --env flag
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET

      # Domain for SIWE messages
      - key: KEYSTORE_DOMAIN
        scope: RUN_TIME
        value: keystore.defirelay.com

      # CORS origins (comma-separated, or * for all)
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: "*"

      # Session settings
      - key: SESSION_TTL_SECS
        scope: RUN_TIME
        value: "3600"

      - key: CHALLENGE_TTL_SECS
        scope: RUN_TIME
        value: "300"

      # Max backup size (10MB)
      - key: MAX_ENCRYPTED_DATA_SIZE
        scope: RUN_TIME
        value: "10485760"

      # Logging
      - key: RUST_LOG
        scope: RUN_TIME
        value: keystore_server=info,tower_http=info

      # x402 Payment Config (OPTIONAL - remove if not using payments)
      # Uncomment and configure if you want to charge for backups
      # - key: X402_WALLET_ADDRESS
      #   scope: RUN_TIME
      #   value: "0xYourWalletAddress"
      # - key: X402_FACILITATOR_SIGNER
      #   scope: RUN_TIME
      #   type: SECRET
      # - key: X402_PAYMENT_TOKEN_ADDRESS
      #   scope: RUN_TIME
      #   value: "0xTokenContractAddress"
      # - key: X402_COST_PER_BACKUP
      #   scope: RUN_TIME
      #   value: "1000000000000000000000"
      # - key: X402_PAYMENT_NETWORK
      #   scope: RUN_TIME
      #   value: "base-sepolia"
