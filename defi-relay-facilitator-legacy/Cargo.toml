[package]
name = "defi-relay-facilitator"
version = "0.1.0"
edition = "2021"
default-run = "webserver"

[dependencies]
actix-web = "4.4.0"
actix-cors = "0.6.4"
tokio = { version = "1.28.1", features = ["rt", "rt-multi-thread", "macros"] }
ethers = { version = "2.0.10", features = ["abigen", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
env_logger = "0.10.0"
log = "0.4"
hex = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }
time = "0.3.36"

[lib]
name = "defi_relay_facilitator"

[[bin]]
name = "webserver"
path = "src/webserver.rs"
