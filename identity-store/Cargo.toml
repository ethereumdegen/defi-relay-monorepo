[package]
name = "identity-store"
version = "0.1.0"
edition = "2021"
description = "EIP-8004 agent identity JSON storage with SIWE authentication"
authors = ["DeFi Relay"]

[[bin]]
name = "identity-store"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tower_governor = "0.4"
governor = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto & Auth
siwe = "0.6"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# HTTP client (for x402 facilitator communication)
reqwest = { version = "0.11", features = ["json"] }

# x402 payment protocol support
base64 = "0.22"
primitive-types = "0.13"

# Error handling
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
